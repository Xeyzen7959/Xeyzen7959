name: Update contribution graph
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/contribution_graph.py
      - .github/workflows/contributions.yml
permissions:
  contents: write
concurrency:
  group: contribution-graph
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVG from README settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 scripts/contribution_graph.py
      - name: Publish changed graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg
          if [ -f assets/private-commit-counts.json ]; then git add assets/private-commit-counts.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution graph'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
